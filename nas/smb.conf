[global]
   server role = standalone server
   server min protocol = SMB3
   smb ports = 445
   disable netbios = yes
   map to guest = never
   restrict anonymous = 2
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file

[files]
   path = /tank/files
   valid users = nas
   force user = nas
   force group = nas
   read only = no
   create mask = 0660
   directory mask = 2770
   vfs objects = fruit streams_xattr
   fruit:metadata = stream
