- name: Check services
  ansible.builtin.command: systemctl is-active {{ item }}
  loop: [garage, unattended-upgrades]
  changed_when: false
  check_mode: false

- name: Collect container state
  ansible.builtin.command: "{{ item.cmd }}"
  loop:
    - { key: listen, cmd: "ss -Htlnp" }
    - { key: version, cmd: "/usr/local/bin/garage --version" }
    - { key: status, cmd: "/usr/local/bin/garage -c /etc/garage/garage.toml status" }
    - { key: mount, cmd: "findmnt -n -o TARGET /var/lib/garage/data" }
    - { key: secret, cmd: "stat -c '%U %a' /etc/garage/rpc_secret" }
  loop_control:
    label: "{{ item.key }}"
  register: garage_state
  changed_when: false
  failed_when: false
  check_mode: false

- name: Index the results
  ansible.builtin.set_fact:
    garage_s: "{{ dict(garage_state.results | map(attribute='item.key') | zip(garage_state.results | map(attribute='stdout'))) }}"

- name: Check Garage listens only where the docs say
  ansible.builtin.assert:
    that:
      - garage_s.listen is search('0\.0\.0\.0:3900')
      - garage_s.listen is not search('(\*|\[::\]):3900')
      - garage_s.listen is search('127\.0\.0\.1:3901')
      - garage_s.listen is not search('(0\.0\.0\.0|\*|\[::\]):3901')
      - garage_s.listen is not search(':3903\s')
      - garage_s.listen is not search(':22\s')
      - garage_s.version is search('garage v' ~ garage_version ~ ' ')
      - garage_s.status is search('HEALTHY NODES')
      - garage_s.mount == '/var/lib/garage/data'
      - garage_s.secret == 'garage 600'
    quiet: true
    fail_msg: Garage container drifted from docs/06-object-storage.md
