- name: Configure smartd for the NVMe
  ansible.builtin.copy:
    src: "{{ proxmox_host_files }}/smartd/smartd.conf"
    dest: /etc/smartd.conf
    mode: "0644"
  notify: Restart smartd

- name: Read Proxmox roles, users and permissions
  ansible.builtin.command: "pveum {{ item }} list --output-format json"
  loop: [role, user, acl]
  register: proxmox_host_pveum
  changed_when: false
  check_mode: false

- name: Index Proxmox roles, users and permissions
  ansible.builtin.set_fact:
    proxmox_host_roles: "{{ proxmox_host_pveum.results[0].stdout | from_json | items2dict(key_name='roleid', value_name='privs') }}"
    proxmox_host_users: "{{ proxmox_host_pveum.results[1].stdout | from_json | map(attribute='userid') | list }}"
    proxmox_host_acl: "{{ proxmox_host_pveum.results[2].stdout | from_json }}"

- name: Create the OpenTofu role
  ansible.builtin.command: >-
    pveum role add {{ proxmox_host_tofu_role }}
    --privs {{ proxmox_host_tofu_privs | join(',') }}
  when: proxmox_host_tofu_role not in proxmox_host_roles
  changed_when: true

- name: Keep the OpenTofu role privileges exact
  ansible.builtin.command: >-
    pveum role modify {{ proxmox_host_tofu_role }}
    --privs {{ proxmox_host_tofu_privs | join(',') }}
  when:
    - proxmox_host_tofu_role in proxmox_host_roles
    - (proxmox_host_roles[proxmox_host_tofu_role] | default('')).split(',') | sort != proxmox_host_tofu_privs | sort
  changed_when: true

- name: Create the OpenTofu user (no password, token only)
  ansible.builtin.command: >-
    pveum user add {{ proxmox_host_tofu_user }}
    --comment "OpenTofu, talos-homelab"
  when: proxmox_host_tofu_user not in proxmox_host_users
  changed_when: true

- name: Give the OpenTofu user its role on /
  ansible.builtin.command: >-
    pveum acl modify / --users {{ proxmox_host_tofu_user }}
    --roles {{ proxmox_host_tofu_role }}
  when: >-
    proxmox_host_acl | selectattr('ugid', 'equalto', proxmox_host_tofu_user)
    | selectattr('path', 'equalto', '/')
    | selectattr('roleid', 'equalto', proxmox_host_tofu_role) | list | length == 0
  changed_when: true

- name: Create the OpenTofu backup storage role
  ansible.builtin.command: >-
    pveum role add {{ proxmox_host_tofu_backup_role }}
    --privs {{ proxmox_host_tofu_backup_privs | join(',') }}
  when: proxmox_host_tofu_backup_role not in proxmox_host_roles
  changed_when: true

- name: Keep the OpenTofu backup storage role privileges exact
  ansible.builtin.command: >-
    pveum role modify {{ proxmox_host_tofu_backup_role }}
    --privs {{ proxmox_host_tofu_backup_privs | join(',') }}
  when:
    - proxmox_host_tofu_backup_role in proxmox_host_roles
    - (proxmox_host_roles[proxmox_host_tofu_backup_role] | default('')).split(',') | sort != proxmox_host_tofu_backup_privs | sort
  changed_when: true

- name: Give the OpenTofu user the backup storage role on the backup storage only
  ansible.builtin.command: >-
    pveum acl modify {{ proxmox_host_tofu_backup_path }} --users {{ proxmox_host_tofu_user }}
    --roles {{ proxmox_host_tofu_backup_role }}
  when: >-
    proxmox_host_acl | selectattr('ugid', 'equalto', proxmox_host_tofu_user)
    | selectattr('path', 'equalto', proxmox_host_tofu_backup_path)
    | selectattr('roleid', 'equalto', proxmox_host_tofu_backup_role) | list | length == 0
  changed_when: true

- name: Create the OpenTofu realm role
  ansible.builtin.command: >-
    pveum role add {{ proxmox_host_tofu_realm_role }}
    --privs {{ proxmox_host_tofu_realm_privs | join(',') }}
  when: proxmox_host_tofu_realm_role not in proxmox_host_roles
  changed_when: true

- name: Keep the OpenTofu realm role privileges exact
  ansible.builtin.command: >-
    pveum role modify {{ proxmox_host_tofu_realm_role }}
    --privs {{ proxmox_host_tofu_realm_privs | join(',') }}
  when:
    - proxmox_host_tofu_realm_role in proxmox_host_roles
    - (proxmox_host_roles[proxmox_host_tofu_realm_role] | default('')).split(',') | sort != proxmox_host_tofu_realm_privs | sort
  changed_when: true

- name: Give the OpenTofu user the realm role on realms only
  ansible.builtin.command: >-
    pveum acl modify {{ proxmox_host_tofu_realm_path }} --users {{ proxmox_host_tofu_user }}
    --roles {{ proxmox_host_tofu_realm_role }}
  when: >-
    proxmox_host_acl | selectattr('ugid', 'equalto', proxmox_host_tofu_user)
    | selectattr('path', 'equalto', proxmox_host_tofu_realm_path)
    | selectattr('roleid', 'equalto', proxmox_host_tofu_realm_role) | list | length == 0
  changed_when: true

- name: Read the realms
  ansible.builtin.command: pveum realm list --output-format json
  register: proxmox_host_realms
  changed_when: false
  check_mode: false

- name: Create the SSO admin once OpenTofu made the realm
  ansible.builtin.command: >-
    pveum user add {{ proxmox_host_sso_admin }}
    --comment "Admin through Pocket ID"
  when:
    - proxmox_host_sso_realm in (proxmox_host_realms.stdout | from_json | map(attribute='realm') | list)
    - proxmox_host_sso_admin not in proxmox_host_users
  changed_when: true

- name: Give the SSO admin Administrator on /
  ansible.builtin.command: >-
    pveum acl modify / --users {{ proxmox_host_sso_admin }} --roles Administrator
  when:
    - proxmox_host_sso_realm in (proxmox_host_realms.stdout | from_json | map(attribute='realm') | list)
    - >-
      proxmox_host_acl | selectattr('ugid', 'equalto', proxmox_host_sso_admin)
      | selectattr('path', 'equalto', '/')
      | selectattr('roleid', 'equalto', 'Administrator') | list | length == 0
  changed_when: true

- name: Read the ACME accounts
  ansible.builtin.command: pvesh get /cluster/acme/account --output-format json
  register: proxmox_host_acme_accounts
  changed_when: false
  check_mode: false

- name: Read the Let's Encrypt terms of service
  ansible.builtin.command: pvesh get /cluster/acme/tos --output-format json
  register: proxmox_host_acme_tos
  changed_when: false
  check_mode: false
  when: >-
    proxmox_host_acme_accounts.stdout | from_json
    | selectattr('name', 'equalto', proxmox_host_acme_account) | list | length == 0

- name: Register the ACME account (root only, so not in OpenTofu)
  ansible.builtin.command: >-
    pvesh create /cluster/acme/account --name {{ proxmox_host_acme_account }}
    --contact {{ proxmox_host_acme_email }}
    --directory {{ proxmox_host_acme_directory }}
    --tos_url {{ proxmox_host_acme_tos.stdout | from_json }}
  when: proxmox_host_acme_tos is not skipped
  changed_when: true

- name: Verify the host
  ansible.builtin.import_tasks: verify.yml
  tags: [verify]
