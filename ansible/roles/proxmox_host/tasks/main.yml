- name: Keep TSO and GSO off on the e1000e NIC at boot (it hangs under load)
  ansible.builtin.lineinfile:
    path: /etc/network/interfaces
    insertafter: "^iface {{ proxmox_host_nic }} inet manual$"
    line: "\tpost-up /usr/sbin/ethtool -K {{ proxmox_host_nic }} tso off gso off"

- name: Read the NIC offload settings
  ansible.builtin.command: ethtool -k {{ proxmox_host_nic }}
  register: proxmox_host_offload
  changed_when: false
  check_mode: false

- name: Turn TSO and GSO off now
  ansible.builtin.command: ethtool -K {{ proxmox_host_nic }} tso off gso off
  when: >-
    proxmox_host_offload.stdout is search('(?m)^(tcp|generic)-segmentation-offload: on')
  changed_when: true

- name: Load the VFIO modules at boot
  ansible.builtin.copy:
    src: "{{ proxmox_host_files }}/vfio/vfio.conf"
    dest: /etc/modules-load.d/vfio.conf
    mode: "0644"
  notify: Update the initramfs

- name: Give the iGPU to vfio-pci before i915 or xe can take it
  ansible.builtin.copy:
    src: "{{ proxmox_host_files }}/vfio/vfio-pci.conf"
    dest: /etc/modprobe.d/vfio-pci.conf
    mode: "0644"
  notify: Update the initramfs

- name: Configure smartd for the NVMe
  ansible.builtin.copy:
    src: "{{ proxmox_host_files }}/smartd/smartd.conf"
    dest: /etc/smartd.conf
    mode: "0644"
  notify: Restart smartd

- name: Verify the host
  ansible.builtin.import_tasks: verify.yml
  tags: [verify]
