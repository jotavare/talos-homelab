- name: Install base packages
  ansible.builtin.apt:
    name: [ca-certificates, curl, openssl, unattended-upgrades]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove the SSH server from the template
  ansible.builtin.apt:
    name: openssh-server
    state: absent
    purge: true

- name: Keep security updates automatic
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../proxmox/apt/52unattended-upgrades-local"
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    mode: "0644"

- name: Add the Tailscale signing key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    checksum: "sha256:{{ openbao_tailscale_key_sha256 }}"
    mode: "0644"

- name: Add the Tailscale repository
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../proxmox/apt/sources/tailscale.sources"
    dest: /etc/apt/sources.list.d/tailscale.sources
    mode: "0644"

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Run Tailscale in userspace mode
  ansible.builtin.copy:
    src: "{{ openbao_files }}/tailscaled"
    dest: /etc/default/tailscaled
    mode: "0644"
  notify: Restart tailscaled

- name: Restart Tailscale with the userspace setting
  ansible.builtin.meta: flush_handlers

- name: Start Tailscale
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Download OpenBao
  ansible.builtin.get_url:
    url: "https://github.com/openbao/openbao/releases/download/v{{ openbao_version }}/openbao_{{ openbao_version }}_linux_amd64.deb"
    dest: "/root/openbao_{{ openbao_version }}_linux_amd64.deb"
    checksum: "sha256:{{ openbao_deb_sha256 }}"
    mode: "0644"

- name: Install OpenBao
  ansible.builtin.apt:
    deb: "/root/openbao_{{ openbao_version }}_linux_amd64.deb"

- name: Configure OpenBao
  ansible.builtin.copy:
    src: "{{ openbao_files }}/openbao.hcl"
    dest: /etc/openbao/openbao.hcl
    owner: openbao
    group: openbao
    mode: "0640"
  notify: Restart OpenBao

- name: Start OpenBao
  ansible.builtin.systemd_service:
    name: openbao
    enabled: true
    state: started

- name: Verify the container
  ansible.builtin.import_tasks: verify.yml
  tags: [verify]
