- name: Check services
  ansible.builtin.command: systemctl is-active {{ item }}
  loop: [tailscaled, openbao, unattended-upgrades]
  changed_when: false
  check_mode: false

- name: Collect container state
  ansible.builtin.command: "{{ item.cmd }}"
  loop:
    - { key: listen, cmd: "ss -Htlnp" }
    - { key: bao, cmd: "bao status -address=https://127.0.0.1:8200 -tls-skip-verify -format=json" }
    - { key: tsflags, cmd: "cat /etc/default/tailscaled" }
  loop_control:
    label: "{{ item.key }}"
  register: openbao_state
  changed_when: false
  failed_when: false
  check_mode: false

- name: Index the results
  ansible.builtin.set_fact:
    openbao_s: "{{ dict(openbao_state.results | map(attribute='item.key') | zip(openbao_state.results | map(attribute='stdout'))) }}"

- name: Check OpenBao listens on localhost only and Tailscale runs in userspace
  ansible.builtin.assert:
    that:
      - openbao_s.listen is search('127\.0\.0\.1:8200')
      - openbao_s.listen is not search('(0\.0\.0\.0|\*|\[::\]):8200')
      - openbao_s.listen is not search(':22\s')
      - openbao_s.tsflags is search('--tun=userspace-networking')
      - (openbao_s.bao | from_json).storage_type == 'raft'
      - (openbao_s.bao | from_json).version == openbao_version
    quiet: true
    fail_msg: OpenBao container drifted from docs/04-secrets.md

- name: Report the seal state
  ansible.builtin.debug:
    msg: >-
      OpenBao initialized={{ (openbao_s.bao | from_json).initialized }},
      sealed={{ (openbao_s.bao | from_json).sealed }}
