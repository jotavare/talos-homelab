all:
  children:
    proxmox:
      hosts:
        pve:
          ansible_host: "{{ lookup('ansible.builtin.env', 'PROXMOX_HOST') }}"
          ansible_user: root
    services:
      hosts:
        services:
          ansible_host: 192.168.1.30
          ansible_user: debian
          ansible_ssh_common_args: >-
            -o ProxyJump=root@{{ lookup('ansible.builtin.env', 'PROXMOX_HOST') }}
            -o StrictHostKeyChecking=accept-new
