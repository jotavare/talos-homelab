all:
  children:
    proxmox:
      hosts:
        pve:
          ansible_host: "{{ homelab_config.proxmox_host }}"
          ansible_user: root
    services:
      hosts:
        services:
          ansible_host: 192.168.1.30
          ansible_user: debian
          ansible_ssh_common_args: >-
            -o ProxyJump=root@{{ homelab_config.proxmox_host }}
            -o StrictHostKeyChecking=accept-new
