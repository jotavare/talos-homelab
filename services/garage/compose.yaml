name: garage

services:
  garage:
    container_name: garage
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: ["/garage", "server", "--single-node"]
    restart: unless-stopped
    secrets:
      - garage_rpc_secret
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - /srv/garage/meta:/var/lib/garage/meta
      - /srv/garage/data:/var/lib/garage/data
    networks:
      - backend

secrets:
  garage_rpc_secret:
    file: /srv/secrets/garage_rpc_secret

networks:
  backend:
    name: backend
    external: true
