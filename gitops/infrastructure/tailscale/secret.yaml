apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: operator-oauth
  data:
    - secretKey: client_id
      remoteRef:
        key: k8s/tailscale-operator
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: k8s/tailscale-operator
        property: client_secret
