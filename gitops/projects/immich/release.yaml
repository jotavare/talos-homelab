apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: immich
  values:
    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.2.4
    immich:
      persistence:
        library:
          existingClaim: immich-library
    valkey:
      enabled: true
    server:
      controllers:
        main:
          containers:
            main:
              env:
                DB_HOSTNAME: immich-database-rw
                DB_DATABASE_NAME: app
                DB_USERNAME:
                  valueFrom:
                    secretKeyRef:
                      name: immich-database-credentials
                      key: username
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: immich-database-credentials
                      key: password
