apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: immich
  values:
    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.2.4
    immich:
      configurationKind: Secret
      existingConfiguration: immich-config
      persistence:
        library:
          existingClaim: immich-library
    valkey:
      enabled: true
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
    machine-learning:
      controllers:
        main:
          containers:
            main:
              image:
                tag: v3.2.4-openvino
              resources:
                requests:
                  cpu: 250m
                  memory: 1Gi
                limits:
                  memory: 4Gi
                  gpu.intel.com/i915: 1
    server:
      controllers:
        main:
          containers:
            main:
              env:
                DB_HOSTNAME: immich-database-rw
                DB_DATABASE_NAME: app
                DB_USERNAME:
                  valueFrom:
                    secretKeyRef:
                      name: immich-database-credentials
                      key: username
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: immich-database-credentials
                      key: password
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 4Gi
                  gpu.intel.com/i915: 1
