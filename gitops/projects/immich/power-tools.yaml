apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-power-tools
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: immich-power-tools
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: k8s/immich-power-tools
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: k8s/immich-power-tools
        property: jwt_secret
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-power-tools
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-power-tools
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-power-tools
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-power-tools
    spec:
      automountServiceAccountToken: false
      hostAliases:
        - ip: 192.168.1.51
          hostnames:
            - immich.home.${DOMAIN}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: main
          image: ghcr.io/immich-power-tools/immich-power-tools:v0.25.0@sha256:85af8a9f116cfb626dcda491a49616baf90108fe428a885df5ab68bd7cddb291
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: IMMICH_URL
              value: http://immich-server.immich.svc.cluster.local:2283
            - name: EXTERNAL_IMMICH_URL
              value: https://immich.home.${DOMAIN}
            - name: POWER_TOOLS_ENDPOINT_URL
              value: https://power-tools.home.${DOMAIN}
            - name: DB_HOST
              value: immich-database-rw.immich.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE_NAME
              value: app
            - name: DB_USERNAME
              value: power_tools
            - name: SECURE_COOKIE
              value: "true"
            - name: OAUTH_ENABLED
              value: "true"
            - name: OAUTH_BUTTON_TEXT
              value: Login with Pocket ID
            - name: APP_DB_PATH
              value: /app/data/app.db
          envFrom:
            - secretRef:
                name: immich-power-tools
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-power-tools
---
apiVersion: v1
kind: Service
metadata:
  name: immich-power-tools
  namespace: immich
spec:
  selector:
    app.kubernetes.io/name: immich-power-tools
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich-power-tools
  namespace: immich
spec:
  parentRefs:
    - name: home
      namespace: gateway
  hostnames:
    - power-tools.home.${DOMAIN}
  rules:
    - backendRefs:
        - name: immich-power-tools
          port: 3000
