apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich-database
  namespace: flux-system
spec:
  dependsOn:
    - name: cnpg
    - name: longhorn
  interval: 10m
  path: ./gitops/projects/immich/database
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich
  namespace: flux-system
spec:
  dependsOn:
    - name: immich-database
    - name: nfs-config
    - name: gateway
  interval: 10m
  path: ./gitops/projects/immich
  prune: true
  wait: true
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-settings
