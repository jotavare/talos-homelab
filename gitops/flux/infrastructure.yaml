apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: intel-gpu
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
  interval: 10m
  retryInterval: 1m
  path: ./gitops/infrastructure/intel-gpu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: intel-gpu-plugin
  namespace: flux-system
spec:
  dependsOn:
    - name: intel-gpu
  interval: 10m
  retryInterval: 1m
  path: ./deployments/gpu_plugin
  prune: true
  wait: true
  timeout: 5m
  targetNamespace: intel-gpu
  sourceRef:
    kind: GitRepository
    name: intel-device-plugins
  patches:
    - target:
        kind: DaemonSet
        name: intel-gpu-plugin
      patch: |
        - op: add
          path: /spec/template/spec/nodeSelector/intel-gpu
          value: "true"
        - op: add
          path: /spec/template/spec/containers/0/args
          value:
            - -shared-dev-num=2
