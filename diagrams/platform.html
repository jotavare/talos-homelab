        <title id="platform-title">Platform</title>
        <desc id="platform-desc">How a request from the tailnet reaches an app through the Tailscale operator, the Cilium Gateway and an HTTPRoute with a cert-manager wildcard certificate, how External Secrets copies secrets from OpenBao, and how apps store data on Longhorn over the workers&#x27; data disks, on CloudNativePG, and on the NAS through the nas storage class, all on Talos nodes with Cilium as the network.</desc>
