      <title id="gitops-title">GitOps order</title>
      <desc id="gitops-desc">Flux fetches the repo from GitHub and applies its eighteen Kustomizations in dependsOn order: the Gateway API CRDs, then Cilium, then storage and CloudNativePG, External Secrets and the add-ons (metrics-server and the Intel GPU plugin from its own repository), then cert-manager, the Tailscale operator and the Gateway, and Immich last, database first.</desc>
