<!DOCTYPE html>

  <style>

<body>

      <title id="gitops-title">GitOps order</title>
      <desc id="gitops-desc">Flux polls the public repository and applies the Gateway API CRDs, then Cilium, then storage, CloudNativePG and External Secrets, then cert-manager, the Tailscale operator and the Gateway, and finally Immich, each step waiting for the steps it depends on.</desc>

      <path d="M 568,236 L 576,236 Q 584,236 584,244 L 584,344 Q 584,352 592,352 L 600,352" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#gitops-a)"/>
      <path d="M 488,256 L 488,408 Q 488,416 496,416 L 884,416 Q 892,416 892,408 L 892,392" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#gitops-a)"/>
      <path d="M 768,352 L 808,352" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#gitops-a)"/>
      <path d="M 768,80 L 1088,80 Q 1096,80 1096,88 L 1096,176" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#gitops-a)"/>
      <path d="M 768,216 L 1016,216" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#gitops-a)"/>

      <path d="M 976,352 L 1128,352 Q 1136,352 1136,344 L 1136,256" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#gitops-a)"/>
      <text x="808" y="452" fill="#a3abbd" font-size="13" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">each arrow is a dependsOn, read backwards; a waiting step retries every minute</text>
      <rect x="24" y="176" width="160" height="80" rx="6" fill="#2d3142"/>
      <rect x="24" y="176" width="160" height="80" rx="6" fill="rgba(106,149,216,0.24)" stroke="#7ea6e6" stroke-width="1.4"/>
      <text x="40" y="202.0" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Flux</text>
      <text x="40" y="221.0" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace">polls GitHub, 1 min</text>
      <text x="40" y="238.0" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace">gitops/flux</text>
      <rect x="216" y="176" width="160" height="80" rx="6" fill="#2d3142"/>
      <rect x="216" y="176" width="160" height="80" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1.4"/>
      <text x="232" y="202.0" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Gateway API</text>
      <text x="232" y="221.0" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace">CRDs v1.6.1</text>
      <text x="232" y="238.0" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace">never pruned</text>
      <rect x="408" y="176" width="160" height="80" rx="6" fill="#2d3142"/>

      <text x="424" y="221.0" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace">network, L2 IPs</text>
      <text x="424" y="238.0" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace">+ config/</text>
      <rect x="600" y="40" width="168" height="80" rx="6" fill="#2d3142"/>
      <rect x="600" y="40" width="168" height="80" rx="6" fill="rgba(245,245,245,0.06)" stroke="#a3abbd" stroke-width="1.4"/>
      <text x="616" y="66.0" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Storage</text>
      <text x="616" y="85.0" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace">Longhorn</text>
      <text x="616" y="102.0" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace">NFS + nas class</text>
      <rect x="600" y="176" width="168" height="80" rx="6" fill="#2d3142"/>
      <rect x="600" y="176" width="168" height="80" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1.4"/>
      <text x="616" y="211.5" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist', sans-serif">CloudNativePG</text>
      <text x="616" y="230.5" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace">operator</text>
      <rect x="600" y="312" width="168" height="80" rx="6" fill="#2d3142"/>
      <rect x="600" y="312" width="168" height="80" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1.4"/>
      <text x="616" y="338.0" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist', sans-serif">External Secrets</text>
      <text x="616" y="357.0" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace">+ OpenBao store</text>
      <text x="616" y="374.0" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace">needs cluster-settings</text>
      <rect x="808" y="312" width="168" height="80" rx="6" fill="#2d3142"/>
      <rect x="808" y="312" width="168" height="80" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1.4"/>
      <text x="824" y="338.0" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Edge</text>
      <text x="824" y="357.0" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace">cert-manager</text>
      <text x="824" y="374.0" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace">Tailscale · Gateway</text>
      <rect x="1016" y="176" width="160" height="80" rx="6" fill="#2d3142"/>
      <rect x="1016" y="176" width="160" height="80" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1.4"/>
      <text x="1032" y="202.0" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Immich</text>
      <text x="1032" y="221.0" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace">database first</text>
      <text x="1032" y="238.0" fill="#bfc0c0" font-size="11" font-family="'Geist Mono', monospace">then the app</text>
      <line x1="24" y1="472" x2="1176" y2="472" stroke="rgba(245,245,245,0.14)" stroke-width="0.8"/>
      <rect x="24" y="488" width="18" height="13" rx="2" fill="rgba(106,149,216,0.24)" stroke="#7ea6e6" stroke-width="1.4"/>
      <text x="50" y="498" fill="#bfc0c0" font-size="11" font-family="'Geist', sans-serif">Source</text>
      <rect x="118.4" y="488" width="18" height="13" rx="2" fill="rgba(239,131,84,0.16)" stroke="#ef8354" stroke-width="1.4"/>
      <text x="144.4" y="498" fill="#bfc0c0" font-size="11" font-family="'Geist', sans-serif">Everything waits for it</text>
      <rect x="321.6" y="488" width="18" height="13" rx="2" fill="rgba(245,245,245,0.06)" stroke="#a3abbd" stroke-width="1.4"/>
      <text x="347.6" y="498" fill="#bfc0c0" font-size="11" font-family="'Geist', sans-serif">Storage</text>
      <line x1="422.40000000000003" y1="494" x2="450.40000000000003" y2="494" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#gitops-a)"/>
      <text x="458.40000000000003" y="498" fill="#bfc0c0" font-size="11" font-family="'Geist', sans-serif">Applied before</text>
    </svg>
