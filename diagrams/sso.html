      <title id="sso-title">SSO</title>
      <desc id="sso-desc">Sequence of a login through Pocket ID: OpenTofu first creates the OIDC clients for OpenBao, both Proxmox hosts (pve and pve-desktop) and Immich and hands each app its secret; then the app redirects me to Pocket ID, I authorize with a passkey, Pocket ID sends me back with a code, and the app exchanges the code for an ID token, checks that it is my user and opens a session.</desc>
