      <title id="immich-title">Immich</title>
      <desc id="immich-desc">The laptop reaches Immich over the tailnet through the Gateway, from the browser and the mobile app; the server and machine learning run on talos-w-2 with its Intel GPU, the server uses Valkey and Postgres on Longhorn, keeps photos on the NAS under a 400G ZFS quota where the database is also dumped nightly, logs users in through Pocket ID and gets its settings and passwords from OpenBao.</desc>
