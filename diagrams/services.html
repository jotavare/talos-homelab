      <title id="services-title">Services</title>
      <desc id="services-desc">The services VM 130 runs five containers that OpenTofu deploys over SSH through pve: Tailscale forwards tailnet port 443 to a custom Caddy build, which gets certificates from Let's Encrypt and proxies to OpenBao, Pocket ID and Garage on an internal Docker network with no route out, and to the Proxmox web UI on the LAN.</desc>
