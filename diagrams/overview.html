      <title id="overview-title">Homelab overview</title>
      <desc id="overview-desc">Home LAN with the ISP router and an OpenWrt access point; the Proxmox host pve runs the services VM with Caddy, OpenBao, Pocket ID, Garage and Tailscale, and three Talos VMs, with the iGPU passed through to talos-w-2 where Immich runs; the NAS on pve-desktop joins over Wi-Fi and serves NFS to the cluster, and the laptop and phone reach the hosts, services, cluster and NAS only over the tailnet, by port.</desc>
