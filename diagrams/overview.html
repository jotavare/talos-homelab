      <title id="overview-title">Homelab overview</title>
      <desc id="overview-desc">Flat home LAN with the ISP router, a Wi-Fi access point and a Proxmox host whose vmbr0 bridge carries the planned Talos Kubernetes VMs and a services VM outside the cluster running Caddy, OpenBao and Garage; Caddy proxies the Proxmox web UI over the LAN, and a laptop or phone reaches Proxmox, the services and the cluster over Tailscale WireGuard tunnels, with Tailscale's coordination server only exchanging keys.</desc>
