        <title id="opentofu-title">OpenTofu</title>
        <desc id="opentofu-desc">OpenTofu on the laptop: every change goes through a saved plan that is read before it is applied; one root with a local state encrypted with AES-GCM from a passphrase reads its tokens from OpenBao, writes cluster secrets back, and configures one provider per system that its modules use to drive Cloudflare, the services VM, Pocket ID, Tailscale, the cluster and Proxmox, where the token holds three narrow roles.</desc>
