machine:
  sysctls:
    net.ipv6.conf.all.accept_ra: "0"
    net.ipv6.conf.all.autoconf: "0"
    net.ipv6.conf.default.accept_ra: "0"
    net.ipv6.conf.default.autoconf: "0"
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: ${installer}
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 1.1.1.1
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 192.168.1.0/24
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
